name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see added.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it address?
      placeholder: "When recovering from a formatted NTFS drive, the quick scan doesn't find files that were in the Recycle Bin..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work? Describe the ideal behavior.
      placeholder: "Add a `--recycle-bin` flag to the quick scan that specifically checks $Recycle.Bin/$I/$R pairs..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions or workarounds have you considered?
      placeholder: "Currently I have to run a deep scan which takes 30 minutes..."

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Core Engine (scanning, carving, filesystems)
        - CLI (commands, flags, output)
        - GUI (screens, UX, accessibility)
        - Documentation
        - Packaging/Distribution
        - CI/CD
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to implement this feature
        - label: I can help test this feature
        - label: I can help write documentation for this feature