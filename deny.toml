# cargo-deny configuration (schema version 2).
# Run with: cargo deny check

[advisories]
version = 2
yanked = "warn"
ignore = [
    # `proc-macro-error` is pulled in transitively by `glib-macros` in the
    # Linux GTK stack (Tauri). It is unmaintained, not vulnerable; the advisory
    # has no fixed release and no runtime exposure in Relift itself.
    "RUSTSEC-2024-0370",
]

[licenses]
version = 2
# Permissive licenses, plus the project's own GPL-3.0-or-later.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "relift-core" },
    { allow = ["GPL-3.0-or-later"], crate = "relift-cli" },
    { allow = ["GPL-3.0-or-later"], crate = "relift-gui" },
    { allow = ["GPL-3.0-or-later"], crate = "relift-testkit" },
    { allow = ["GPL-3.0-or-later"], crate = "relift-bench" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
