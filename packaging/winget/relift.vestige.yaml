ShortDescription: Free, open-source data recovery for Windows, macOS, and Linux
Description: Relift recovers deleted files from HDDs, SSDs, USB drives, SD cards, and disk images. It uses filesystem metadata (NTFS $MFT, FAT directories, ext4 inodes) to restore original names and paths, and falls back to validating signature carving for formatted or corrupted volumes. Strictly read-only on source, recovery only to a different physical volume.
