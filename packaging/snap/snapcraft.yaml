# TEMPLATE ONLY. Validate confinement, source revision, and store policy before submission.
name: relift
version: '0.1.0'
summary: Free, open-source data recovery for Windows, macOS, and Linux
description: |
  Relift scans raw disk images and devices using filesystem metadata and
  structurally validated file signatures. Recovery output must use a separate
  destination. See the repository support matrix for tested and experimental
  filesystems and formats.

grade: devel
confinement: classic
base: core22

apps:
  relift:
    command: bin/relift
    plugs:
      - block-devices
      - removable-media
      - home

parts:
  relift:
    plugin: rust
    source: .
    source-type: git
    source-tag: v1.0.0
    source-depth: 1
    cargo-features: []
    build-packages:
      - pkg-config
      - libssl-dev
    build-environment:
      - CARGO_HOME: $SNAPCRAFT_PART_BUILD/cargo_home
      - RUSTUP_HOME: $SNAPCRAFT_PART_BUILD/rustup_home
    override-build: |
      cargo build --release --workspace -p relift-cli --locked
      install -Dm755 target/release/relift $SNAPCRAFT_PART_INSTALL/bin/relift

layout:
  /usr/bin/relift: bin/relift
  /usr/share/licenses/relift/LICENSE: LICENSE
  /usr/share/doc/relift/README.md: README.md
