[package]
name = "relift-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Benchmarks for Relift recovery engine"
autobins = false

[[bench]]
name = "relift-bench"
path = "src/main.rs"
harness = false

[dependencies]
relift-core = { path = "../relift-core" }
relift-testkit = { path = "../relift-testkit" }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
memchr = { workspace = true }
