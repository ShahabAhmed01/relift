[workspace]
resolver = "2"
members = [
    "crates/relift-core",
    "crates/relift-cli",
    "crates/relift-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/ShahabAhmed01/relift"
authors = ["Shahab Ahmed"]
description = "Read-only deleted-file recovery for disk images and drives"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
