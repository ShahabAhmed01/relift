[workspace]
resolver = "2"
members = [
    "crates/relift-core",
    "crates/relift-cli",
    "crates/relift-testkit",
    "crates/relift-gui",
    "crates/relift-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/ShahabAhmed01/relift"
authors = ["Shahab Ahmed"]
description = "Read-only deleted-file recovery for disk images and drives"

[workspace.dependencies]
anyhow = "1"
aho-corasick = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
memchr = "2"
memmap2 = "0.9"
nom = "7"
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true