[workspace]
resolver = "2"
members = [
    "crates/relift-core",
    "crates/relift-cli",
    "crates/relift-testkit",
    "crates/relift-gui/src-tauri",
    "crates/relift-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/ShahabAhmed01/relift"
authors = ["Shahab Ahmed"]

[workspace.dependencies]
anyhow = "1"
cap-fs-ext = "=3.4.6"
cap-std = "=4.0.3"
rustix = { version = "=1.1.6", features = ["fs"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.5"
crc32fast = "1"
flate2 = "1"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
